<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 p5.js 期末互動藝術作品</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="landing-page" class="overlay">
        <div class="card">
            <h1>數位互動藝術空間</h1>
            <p class="description">歡迎來到我的期末作品！這是一個結合視覺與流體互動的實驗網站。</p>
            
            <div class="instruction-box">
                <h3>互動指南：</h3>
                <ul>
                    <li>🖱️ <b>移動滑鼠：</b> 改變粒子流向與色彩</li>
                    <li>👆 <b>點擊畫面：</b> 釋放能量波形</li>
                    <li>🎹 <b>按下空白鍵 (Space)：</b> 切換視覺主題</li>
                </ul>
            </div>

            <button id="start-btn">進入體驗</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
